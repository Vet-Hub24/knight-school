name: Test Knight School development
on:
  pull_request:
  push:
    branches: ['development/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate lessons, board assets, training, restore, and offline support
        run: npm test
